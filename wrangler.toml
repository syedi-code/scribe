# Cloudflare Pages configuration for scribe.
name = "scribe"
pages_build_output_dir = "dist"
compatibility_date = "2025-08-24"

# Branch main deploys production at scribe.socialeating.studio, from CI on
# push; see .github/workflows. There is no staging environment yet.
#
# WORKER_URL is set on the Pages project, not here:
#   production  https://alexandria.socialeating.studio
#
# For local development, run alexandria on :8787 and vite proxies to it.
# Point somewhere else with VITE_API_TARGET.

# `wrangler pages deploy` treats this file as the source of truth and clears
# project variables that are not declared here — which is why setting
# WORKER_URL through the dashboard or API did not survive a deploy. It is not
# a secret, so it lives in the repo.
[vars]
WORKER_URL = "https://alexandria.socialeating.studio"

[env.preview.vars]
WORKER_URL = "https://antisocial-worker-staging.iysyed01.workers.dev"
