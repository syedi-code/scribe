<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Ask the library a question. Every quote in the answer is checked against the page it names."
		/>
		<meta name="theme-color" content="#f4efe3" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/GT-Alpina-Standard-Light.woff2"
			crossorigin
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/GT-Alpina-Standard-Bold.woff2"
			crossorigin
		/>
		<!--
			The two italics, which are the whole of what is set in a slant here: a
			work's title, and the wordmark. Without these the roman arrives first and
			the italic is discovered only once the stylesheet has been parsed, so on a
			phone the prose paints in GT Alpina Light while every book name beside it
			is still in the fallback — Iowan Old Style on iOS, which is a far darker
			face. A title next to prose it is two shades heavier than does not read as
			an italic. It reads as bold, and that is what it was reported as, twice.
		-->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/GT-Alpina-Standard-Bold-Italic.woff2"
			crossorigin
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/GT-Alpina-Standard-Light-Italic.woff2"
			crossorigin
		/>
		<title>scribe-lm</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
